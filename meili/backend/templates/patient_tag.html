<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #eef7ff;
      color: #16324f;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 480px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(22, 50, 79, 0.15);
    }

    h1 {
      margin-top: 0;
      color: #1677c8;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffe0e0;
      color: #b42318;
      font-weight: bold;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ patient.name }}</h1>

    <p>
      <span class="label">Status:</span>
      <span class="status">{{ patient.status }}</span>
    </p>

    <p><span class="label">Patient ID:</span> {{ patient.patient_id }}</p>
    <p><span class="label">Date of birth:</span> {{ patient.dob }}</p>
    <p><span class="label">Notes:</span> {{ patient.notes }}</p>
  </main>
</body>
</html>
